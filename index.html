<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">       
    </head>
    <body>
        <script src="index.js"> 
        <div class="container">
            <div style="align-content:center;">
                <h3 style="color: white; font-size:40px; text-align:center; line-height:0px; font-family:Verdana; font-weight:700; font-style:bold;">HOME</h3>
                <div class="counter">
                <h1 id="homeScore" class="counter-number"> 0 </h1>
                </div>
                
                <div class="addNum">
                <div class="small-btn"> <p id="addHome1" onclick="addHome1()"> +1 </p> </div>
                <div class="small-btn"> <p id="addHome2" onclick="addHome2()"> +2 </p> </div>
                <div class="small-btn"> <p id="addHome3" onclick="addHome3()"> +3 </p> </div>
                </div>
  
            </div>

            <div style="align-content:center;">
                <h3 style="font-family:Verdana; font-weight:700; font-style:bold; color: white; font-size:40px; text-align:center; line-height:0px"> GUEST </h3>
                <div class="counter">
                <h1 id="guestScore" class="counter-number"> 0 </h1>
                </div>
                  
                <div class="addNum">
                <div class="small-btn"> <p id="addGuest1" onclick="addGuest1()"> +1 </p> </div>
                <div class="small-btn"> <p id="addGuest2" onclick="addGuest2()"> +2 </p> </div>
                <div class="small-btn"> <p id="addGuest3" onclick="addGuest3()"> +3 </p> </div>
                </div>
                
            </div>
        </div>
     </script>
    </body>
</html>
